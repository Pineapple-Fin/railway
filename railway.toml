[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
builder = "paketobuildpacks/builder:base"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[vm]
cpu_kind = "shared"
cpus = 1
memory = "256mb"

[[env]]
name = "DISCORD_TOKEN"
description = "Your Discord tokens"
required = true

[[env]]
name = "USERNAME"
description = "Your Ethone account username (create account first at app.ethone.cc)"
required = true

[[env]]
name = "PASSWORD"
description = "Your Ethone account password"
required = true

